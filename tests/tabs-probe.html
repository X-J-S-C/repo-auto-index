<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="./assets/app-ui.css"></head>
<body data-hana-app-ui>
<div id="root" data-hana-app-ui><div id="host" data-hana-app-ui></div></div>
<script type="module">
import { mountAppUi } from "./assets/app-ui.js";

const TABS = [
  { value: "a", label: "甲" },
  { value: "b", label: "乙" },
  { value: "c", label: "丙" },
];

const host = document.getElementById("host");
const state = { value: "a" };

const props = () => ({
  items: TABS,
  value: state.value,
  onChange: (v) => { state.value = v; report("onChange:" + v); },
});

window.__report = [];
function report(s) { window.__report.push(s); }

const h = mountAppUi(host, "Tabs", props());
window.__handle = h;
window.__setValue = (v) => { state.value = v; h.update(props()); };
window.__setValueNoUpdate = (v) => { state.value = v; };

window.__read = () => {
  const btns = [...host.querySelectorAll('[role="tab"]')];
  const ind = host.querySelector('[role="presentation"]');
  return {
    selected: btns.map(b => (b.getAttribute("aria-selected") === "true" ? b.textContent.trim() : null)).filter(Boolean),
    aria: btns.map(b => b.getAttribute("aria-selected")),
    indicatorVars: ind ? {
      left: ind.style.getPropertyValue("--active-tab-left"),
      right: ind.style.getPropertyValue("--active-tab-right"),
    } : null,
    report: window.__report.slice(),
  };
};
window.__clickIdx = (i) => {
  const btns = [...host.querySelectorAll('[role="tab"]')];
  btns[i]?.click();
};
</script>
</body></html>
